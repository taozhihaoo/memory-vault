version: "3.9"

services:
  memoryvault:
    build: .
    container_name: memoryvault
    ports:
      - "8000:8000"
    volumes:
      # Your documents: mounted read-only into the indexer's view.
      - ./examples/sample-docs:/docs:ro
      # The SQLite vault lives here and survives container upgrades.
      - memoryvault-data:/data
    environment:
      MEMORYVAULT_DOCS: /docs
      MEMORYVAULT_DATA: /data
    restart: unless-stopped

volumes:
  memoryvault-data:
