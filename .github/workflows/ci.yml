name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run test-suite
        run: pytest tests/ -v --tb=short

      - name: Smoke-test the CLI
        run: |
          mkdir -p /tmp/demo
          printf '# Demo\n\nhello vault content\n' > /tmp/demo/demo.md
          memoryvault --db /tmp/demo/vault.db index /tmp/demo
          memoryvault --db /tmp/demo/vault.db search "hello"
          memoryvault --db /tmp/demo/vault.db stats

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t memoryvault:ci .

      - name: Smoke-test container
        run: |
          docker run -d --name mv -p 8000:8000 \
            -v "$PWD/examples/sample-docs:/docs:ro" memoryvault:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          curl -fsS "http://127.0.0.1:8000/api/search?q=quantum" | grep -q '"total"'
          docker rm -f mv > /dev/null
