name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest tests/ -v --tb=short

      # Cross-platform: no /tmp, no printf, no shell-specific paths.
      - name: Smoke-test the CLI
        run: python scripts/smoke_cli.py

      - name: Verify schema upgrade path
        run: python -c "from memoryvault.database.schema import SCHEMA_VERSION; assert SCHEMA_VERSION >= 2"

  frontend:
    name: Frontend tests + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Runtime dependencies must stay free of high/critical advisories.
      - name: Audit runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # 18 node:test cases: i18n parity, safe highlighting, formatting, API URLs.
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docs:
    name: README links and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify local documentation links
        run: python scripts/check_docs.py

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend, docs]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build image
        run: docker build -t memoryvault:ci .

      - name: Start container
        run: |
          docker run -d --name mv -p 8000:8000 \
            -v "$PWD/examples/sample-docs:/docs:ro" memoryvault:ci

      # Checks health, search, SPA shell, favicon, JSON 404s and CORS policy.
      - name: Smoke-test container
        run: python scripts/smoke_http.py --base http://127.0.0.1:8000

      - name: Container logs on failure
        if: failure()
        run: docker logs --tail 200 mv

      - name: Clean up
        if: always()
        run: docker rm -f mv > /dev/null 2>&1 || true
